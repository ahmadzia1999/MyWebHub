name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Setup Android SDK & Accept Licenses
      run: |
        mkdir -p $HOME/android-sdk/cmdline-tools
        cd $HOME/android-sdk/cmdline-tools
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O tools.zip
        unzip -q tools.zip
        mv cmdline-tools latest
        echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
        echo "ANDROID_SDK_ROOT=" >> $GITHUB_ENV
        echo "PATH=$HOME/android-sdk/cmdline-tools/latest/bin:$HOME/android-sdk/platform-tools:$PATH" >> $GITHUB_ENV
        
        # تایید مجوزها با دستور استاندارد
        yes | sdkmanager --licenses > /dev/null 2>&1 || true

    - name: Prepare WWW Folder
      run: |
        mkdir -p www
        cp index.html www/

    - name: Install Capacitor and Init
      run: |
        npm init -y
        npm install @capacitor/core @capacitor/cli @capacitor/android
        npx cap init "WebHub" "com.webhub.app" --web-dir="www"
        npx cap add android

    - name: Sync Capacitor
      run: npx cap sync android

    - name: Build APK
      run: |
        cd android
        
        # این دستور به Gradle می‌گوید که به جای نسخه‌های جدید، از نسخه‌های موجود در سیستم استفاده کن
        sed -i 's/compileSdkVersion .*/compileSdkVersion 34/' app/build.gradle
        sed -i 's/targetSdkVersion .*/targetSdkVersion 34/' app/build.gradle
        sed -i 's/buildToolsVersion .*/buildToolsVersion "34.0.0"/' app/build.gradle
        
        chmod +x gradlew
        echo "sdk.dir=$ANDROID_HOME" > local.properties
        ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: WebHub-Debug-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk
